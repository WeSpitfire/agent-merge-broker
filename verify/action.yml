name: Verify Merge Broker provenance
description: >-
  Verify a pull request head as an immutable Merge Broker batch. Reads only Git, so it checks
  structure before dependencies are installed and authenticates the broker when protected-base
  policy requires a trusted signature.
author: PowerHouse Exteriors

branding:
  icon: git-merge
  color: purple

inputs:
  version:
    description: Version of agent-merge-broker to run. Pin this.
    required: false
    default: 0.15.0
  branch:
    description: Head branch of the pull request.
    required: false
    default: ${{ github.head_ref }}
  head:
    description: Head commit of the pull request.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  base:
    description: Commit on the target branch to verify against.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  base-branch:
    description: Expected target branch. Defaults to the base-branch policy committed on the base.
    required: false
    default: ""
  branch-prefix:
    description: Integration branch prefix. Defaults to the policy committed on the base.
    required: false
    default: ""
  provenance-directory:
    description: Directory holding batch manifests. Defaults to the policy committed on the base.
    required: false
    default: ""
  working-directory:
    description: Repository directory to verify.
    required: false
    default: .

runs:
  using: composite
  steps:
    # agent-merge-broker requires Node.js 22+. Only install Node when the runner's default is older, so
    # a caller's own setup-node selection is not replaced for later steps.
    - name: Check Node.js version
      id: node
      shell: bash
      run: |
        major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        if [ "${major}" -ge 22 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
    - name: Set up Node.js 22
      if: steps.node.outputs.ready != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
    - name: Verify Merge Broker provenance
      shell: bash
      env:
        AMB_VERSION: ${{ inputs.version }}
        AMB_BRANCH: ${{ inputs.branch }}
        AMB_HEAD: ${{ inputs.head }}
        AMB_BASE: ${{ inputs.base }}
        AMB_BASE_BRANCH: ${{ inputs.base-branch }}
        AMB_BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        AMB_PROVENANCE_DIRECTORY: ${{ inputs.provenance-directory }}
        AMB_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -z "${AMB_BRANCH}" ] || [ -z "${AMB_HEAD}" ] || [ -z "${AMB_BASE}" ]; then
          echo "::error::branch, head, and base are required. On non-pull_request events, pass them explicitly."
          exit 1
        fi
        repository="$(cd -- "${GITHUB_WORKSPACE}" && cd -- "${AMB_WORKING_DIRECTORY}" && pwd -P)"
        # Git Bash on Windows reports /d/a/... paths; Node needs the native form.
        if command -v cygpath >/dev/null 2>&1; then repository="$(cygpath -w "${repository}")"; fi
        args=(-C "${repository}" verify-provenance --branch "${AMB_BRANCH}" --head "${AMB_HEAD}" --base "${AMB_BASE}")
        if [ -n "${AMB_BASE_BRANCH}" ]; then
          args+=(--base-branch "${AMB_BASE_BRANCH}")
        fi
        if [ -n "${AMB_BRANCH_PREFIX}" ]; then
          args+=(--branch-prefix "${AMB_BRANCH_PREFIX}")
        fi
        if [ -n "${AMB_PROVENANCE_DIRECTORY}" ]; then
          args+=(--provenance-directory "${AMB_PROVENANCE_DIRECTORY}")
        fi
        # Resolve and run the verifier from an empty directory outside the checkout. Run inside the
        # pull request tree, npx would honor its committed .npmrc and prefer a committed
        # node_modules/agent-merge-broker, letting the change under review choose its own verifier.
        runner="$(mktemp -d "${RUNNER_TEMP:-/tmp}/merge-broker-verify.XXXXXX")"
        cd -- "${runner}"
        # The package's executables are merge-broker, amb, and merge-broker-mcp, so name one.
        npx --yes --package "agent-merge-broker@${AMB_VERSION}" -- merge-broker "${args[@]}"
