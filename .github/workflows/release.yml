name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a recent npm. Pin it so a release cannot change underneath us
      # between verification and publication.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run verify
      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"
      # Authentication is the id-token permission above: npm exchanges the workflow's OIDC token for
      # a short-lived publish credential. There is deliberately no NODE_AUTH_TOKEN here, so a leaked
      # repository secret cannot publish this package.
      - run: npm publish --provenance --access public
