name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dependabot owns advisory reporting; avoid making every matrix lane wait on npm's audit API.
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - run: npm run verify
      # The example is the acceptance test: it drives the documented worker flow end to end.
      - run: npm run example
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm pack --dry-run
