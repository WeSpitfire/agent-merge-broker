name: Verify package

on:
  workflow_call:
    inputs:
      revision:
        description: Immutable commit SHA to verify and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      # Set the checkout policy before Git materializes schemas and workflow fixtures. Changing
      # autocrlf afterward leaves CRLF bytes behind and breaks byte-for-byte generated-file checks.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify immutable checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.revision }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # Dependabot reports advisories; every lane must exercise the same locked dependencies.
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: node scripts/update-schema-snapshots.mjs --check
      - run: npm run example
      - run: npm run example:gate
      - name: Install and exercise both actual npm tarballs
        run: npm run test:package -- --pack-destination release-package --core-pack-destination release-core-package
      # Publication consumes these exact tested bytes, and can start only after every lane passes.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: npm-package-${{ inputs.revision }}
          path: |
            release-package/*.tgz
            release-package/package-integrity.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: npm-core-package-${{ inputs.revision }}
          path: |
            release-core-package/*.tgz
            release-core-package/package-integrity.json
          if-no-files-found: error
          retention-days: 7
